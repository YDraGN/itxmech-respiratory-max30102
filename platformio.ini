; Build bằng PlatformIO (VS Code extension hoặc lệnh `pio`), dùng chính project ESP-IDF này.
; Cách khác: idf.py (ESP-IDF v5.1+), xem README.
;   pio run                     build
;   pio run -t upload           nạp
;   pio device monitor          xem log
;   pio run -t erase            xóa flash (lần đầu nạp lên mạch đã có firmware cũ)

[platformio]
src_dir = main
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@6.10.0
framework = espidf
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Thử nghiệm thật: giống hệt bản chạy thật (phút 60 giây, model sau 60 phút), chỉ thêm nhật ký qua BLE
; để xem log trên app (màn Vòng đeo tay → Nhật ký vòng) khi vòng chạy bằng pin, không cắm USB.
;   pio run -e esp32c3_test -t upload
[env:esp32c3_test]
extends = env:esp32c3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.test"

; Demo nhanh: 1 "phút" = 10 giây, model chạy sau ~10 phút thay vì 60 phút (kết quả không có ý nghĩa y khoa).
;   pio run -e esp32c3_demo -t upload
[env:esp32c3_demo]
extends = env:esp32c3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.demo"
